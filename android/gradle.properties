# JVM memory (keep your high limits)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Android config
android.useAndroidX=true
android.ndkVersion=27.0.12077973

# ---- KOTLIN STABILITY FIX (CRITICAL) ----

# Disable incremental compilation (prevents cache corruption)
kotlin.incremental=false

# Disable Kotlin daemon (compile inside Gradle JVM)
kotlin.compiler.execution.strategy=in-process
